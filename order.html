<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문 확인 | GYEOL 결</title><link rel="stylesheet" href="style.css"></head><body>
<header id="hd"></header>
<main class="ord" id="ob"></main>
<footer id="ft"></footer>
<script src="main.js"></script>
<script>
const g=i=>document.getElementById(i),box=g('ob'),d=getOrder();
const it=d?clean(d.items||[d]).map(x=>({...x,p:P.find(y=>y.id===x.id)})):[];
if(!it.length){box.innerHTML='<div class="done"><h2>주문할 상품이 없습니다</h2><p>상품 상세 페이지의 구매하기 또는 장바구니의 주문하기를 이용해 주세요.</p><a class="btn" href="index.html">메인 페이지로</a></div>';}
else{const tot=it.reduce((a,x)=>a+x.p.p*x.q,0),cnt=it.reduce((a,x)=>a+x.q,0);
box.innerHTML='<h1>주문 확인</h1>'+it.map(x=>`<div class="od">${art(x.p)}<div><h3>${x.p.n}</h3><p class="rw"><span>옵션</span>${x.o}</p><p class="rw"><span>수량</span>${x.q}개</p><p class="rw"><span>상품 가격</span>${won(x.p.p)}</p></div></div>`).join('')+`<p class="rw tt"><span>총금액</span><b>${won(tot)}</b></p><p class="hint" style="margin:16px 0 24px">시연용 주문입니다. 실제 결제는 이루어지지 않습니다.</p><div class="bt"><button class="btn line" type="button" id="cn">주문 취소</button><button class="btn" type="button" id="dn">주문 완료</button></div>`;
g('cn').onclick=()=>{setOrder(null);const one=it.length===1&&!d.fromCart;box.innerHTML=`<div class="done"><h2>주문이 취소되었습니다</h2><p>${d.fromCart?'장바구니의 상품은 그대로 보관됩니다.':it[0].p.n+' 주문이 취소되었습니다.'}</p><div class="bt">${one?`<a class="btn line" href="product.html?id=${it[0].p.id}">상품으로 돌아가기</a>`:''}<a class="btn" href="index.html">메인 페이지로</a></div></div>`;window.scrollTo(0,0)};
g('dn').onclick=()=>{const no='GY'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000);const nm=it.length>1?`${it[0].p.n} 외 ${it.length-1}종`:`${it[0].p.n} (${it[0].o})`;
addOrder({no,t:Date.now(),items:it.map(x=>({id:x.id,o:x.o,q:x.q}))});setOrder(null);if(d.fromCart)setCart([]);
box.innerHTML=`<div class="done"><h2>주문이 완료되었습니다</h2><p>주문번호 ${no}<br>${nm} · 총 ${cnt}개 · ${won(tot)}<br>시연용 주문이므로 실제 결제와 배송은 진행되지 않습니다.</p><div class="bt"><a class="btn line" href="orders.html?tab=tracking">배송 조회</a><a class="btn" href="index.html">쇼핑 계속하기</a></div></div>`;window.scrollTo(0,0)};}
</script></body></html>
