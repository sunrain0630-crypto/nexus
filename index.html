<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | GYEOL 결</title><link rel="stylesheet" href="style.css"></head><body>
<header id="hd"></header>
<main class="form"><div id="box"><h1>로그인</h1>
<form id="lf" novalidate>
<div class="f"><label for="lid">아이디 또는 이메일</label><input type="text" id="lid" autocomplete="username"><div class="err" id="e-id"></div></div>
<div class="f"><label for="lpw">비밀번호</label><input type="password" id="lpw" autocomplete="current-password"><div class="err" id="e-pw"></div></div>
<div id="rs" role="alert"></div><button class="btn" type="submit">로그인</button></form>
<p class="alt-link">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p></div></main>
<footer id="ft"></footer>
<script src="main.js"></script>
<script>
const g=i=>document.getElementById(i);
g('lf').addEventListener('submit',e=>{e.preventDefault();
const id=g('lid').value.trim(),pw=g('lpw').value,er={};
if(!id)er.id='아이디 또는 이메일을 입력해 주세요.';
else if(id.includes('@')?!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id):!/^[A-Za-z0-9]{4,16}$/.test(id))er.id='아이디(영문·숫자 4–16자) 또는 올바른 이메일 형식으로 입력해 주세요.';
if(!pw)er.pw='비밀번호를 입력해 주세요.';
g('e-id').textContent=er.id||'';g('e-pw').textContent=er.pw||'';g('rs').innerHTML='';
if(er.id||er.pw)return;
let u=null;try{u=JSON.parse(localStorage.getItem('gy_user'));}catch(x){}
const bad=m=>g('rs').innerHTML=`<div class="res bad">${m}</div>`;
if(!u||(u.id!==id&&u.em!==id))return bad('가입된 회원 정보를 찾을 수 없습니다. 먼저 회원가입을 진행해 주세요.');
if(u.pw!==pw)return bad('비밀번호가 올바르지 않습니다. 다시 확인해 주세요.');
sv('gy_session',u.id);g('box').innerHTML=`<div class="done"><h2>로그인되었습니다</h2><p>${esc(u.name)}님, 환영합니다.</p><div class="bt"><a class="btn line" href="mypage.html">마이페이지</a><a class="btn" href="index.html">쇼핑 계속하기</a></div></div>`;});
</script></body></html>
