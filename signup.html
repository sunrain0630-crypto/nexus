<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | GYEOL 결</title><link rel="stylesheet" href="style.css"></head><body>
<header id="hd"></header>
<main class="form"><div id="box"><h1>회원가입</h1>
<form id="sf" novalidate>
<div class="f"><label for="uid">아이디</label><input type="text" id="uid" autocomplete="username"><div class="hint">영문, 숫자 4–16자</div><div class="err" id="e-uid"></div></div>
<div class="f"><label for="pw">비밀번호</label><input type="password" id="pw" autocomplete="new-password"><div class="hint">영문과 숫자를 포함한 8자 이상</div><div class="err" id="e-pw"></div></div>
<div class="f"><label for="pw2">비밀번호 확인</label><input type="password" id="pw2" autocomplete="new-password"><div class="err" id="e-pw2"></div></div>
<div class="f"><label for="nm">이름</label><input type="text" id="nm" autocomplete="name"><div class="err" id="e-nm"></div></div>
<div class="f"><label for="em">이메일</label><input type="email" id="em" autocomplete="email"><div class="err" id="e-em"></div></div>
<label class="chk"><input type="checkbox" id="tm"> [필수] 이용약관 및 개인정보 처리방침에 동의합니다.</label><div class="err" id="e-tm"></div>
<button class="btn" type="submit">가입하기</button></form>
<p class="alt-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></p></div></main>
<footer id="ft"></footer>
<script src="main.js"></script>
<script>
const $=id=>document.getElementById(id);
$('sf').addEventListener('submit',e=>{e.preventDefault();
const v={uid:$('uid').value.trim(),pw:$('pw').value,pw2:$('pw2').value,nm:$('nm').value.trim(),em:$('em').value.trim()};
const er={};
if(!v.uid)er.uid='아이디를 입력해 주세요.';else if(!/^[A-Za-z0-9]{4,16}$/.test(v.uid))er.uid='영문, 숫자 4–16자로 입력해 주세요.';
if(!v.pw)er.pw='비밀번호를 입력해 주세요.';else if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(v.pw))er.pw='영문과 숫자를 포함해 8자 이상 입력해 주세요.';
if(!v.pw2)er.pw2='비밀번호를 한 번 더 입력해 주세요.';else if(v.pw!==v.pw2)er.pw2='비밀번호가 일치하지 않습니다.';
if(!v.nm)er.nm='이름을 입력해 주세요.';
if(!v.em)er.em='이메일을 입력해 주세요.';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.em))er.em='올바른 이메일 형식이 아닙니다.';
if(!$('tm').checked)er.tm='필수 약관에 동의해 주세요.';
['uid','pw','pw2','nm','em','tm'].forEach(k=>$('e-'+k).textContent=er[k]||'');
if(Object.keys(er).length)return;
try{localStorage.setItem('gy_user',JSON.stringify({id:v.uid,pw:v.pw,name:v.nm,em:v.em}));}catch(x){}
$('box').innerHTML=`<div class="done"><h2>가입이 완료되었습니다</h2><p>${esc(v.nm)}님, 결에 오신 것을 환영합니다.<br>로그인 후 이용해 주세요.</p><a class="btn" href="login.html">로그인하러 가기</a></div>`;});
</script></body></html>
